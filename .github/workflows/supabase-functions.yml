name: Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify secrets present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN secret is missing"; exit 1; fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then echo "::error::SUPABASE_PROJECT_ID secret is missing"; exit 1; fi
          echo "Secrets OK. Project: $SUPABASE_PROJECT_ID"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.6.8

      - name: Deploy all functions
        run: |
          set -e
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            if [ "$name" = "_shared" ]; then continue; fi
            echo "::group::Deploying $name"
            supabase functions deploy "$name" \
              --project-ref "$SUPABASE_PROJECT_ID"
            echo "::endgroup::"
          done
          echo "All functions deployed ✓"

      - name: Summary
        run: |
          echo "## Deployed Edge Functions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Function | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            if [ "$name" = "_shared" ]; then continue; fi
            echo "| \`$name\` | https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/$name |" >> $GITHUB_STEP_SUMMARY
          done
